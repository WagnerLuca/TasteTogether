name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Both jobs build on every event and additionally push on branch/tag pushes.
  # Pull requests build only (no login, no push), so a PR still gates the images.
  backend:
    name: Build & push backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Spelled out in lowercase rather than derived from the repo name
          # (which is mixed-case "TasteTogether") — this has to match exactly
          # what docker-compose.prod.yml pulls.
          images: ghcr.io/${{ github.repository_owner }}/tastetogether-backend
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # The frontend installs @wagnerluca/ui from GitHub Packages (see
  # frontend/.npmrc), so its build needs a read:packages token — handed to
  # BuildKit as a secret, exactly as the portfolio's and the arcade's builds do.
  #
  # GHP_READ_TOKEN is that same classic PAT; reuse it rather than minting a
  # second one. The default GITHUB_TOKEN is NOT a substitute here: it is scoped
  # to THIS repository, so it cannot read a package owned by the design system.
  # (It *is* what we use to push to GHCR above — that's this repo's own package.)
  frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tastetogether-frontend
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GHP_READ_TOKEN }}
          # Optional WL Konto sign-in: set the repository variable KONTO_URL to turn it on.
          build-args: |
            VITE_KONTO_URL=${{ vars.KONTO_URL }}
