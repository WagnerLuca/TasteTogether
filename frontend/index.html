<!doctype html>
<!-- lang is rewritten by the shared locale hook (src/wl/useLocale.ts); "de" is
     the ecosystem default, matching the design system's useLocale.js. -->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WL TasteTogether</title>
    <!-- The design system's three faces, same set the portfolio and arcade load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Apply the stored theme before first paint. Without this, a dark-mode
         visitor gets a white flash while React mounts and useTheme runs. Same
         storage key ("wl-theme") as every other Wagner Luca app, so the choice
         carries across modules served from the same origin. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('wl-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* localStorage blocked — fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
